<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eaf9f6" />
    <title>Zoan — 5 second mobile showreel</title>
    <style>
      :root {
        color-scheme: light;
        --mint: #b0f1ed;
        --ink: #183b39;
        --muted: #64817e;
      }

      * { box-sizing: border-box; }

      html, body {
        min-height: 100%;
        margin: 0;
        background: #eaf9f6;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 18px 16px 14px;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      .player {
        width: min(100%, calc((100vh - 102px) * 1.7777778));
      }

      .frame {
        width: 100%;
        overflow: hidden;
        aspect-ratio: 16 / 9;
        background: #eaf9f6;
        border-radius: 12px;
        box-shadow: 0 24px 80px rgba(33, 90, 84, .12), 0 2px 8px rgba(33,90,84,.08);
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .controls {
        min-height: 62px;
        display: grid;
        grid-template-columns: auto auto auto auto minmax(100px, 1fr) minmax(72px, auto);
        align-items: center;
        gap: 8px;
        padding: 10px 2px 0;
      }

      button {
        min-height: 38px;
        border: 1px solid rgba(43, 105, 99, .17);
        border-radius: 999px;
        padding: 0 15px;
        color: #17423e;
        background: rgba(255,255,255,.73);
        font: 600 13px/1 Inter, ui-sans-serif, system-ui, sans-serif;
        letter-spacing: .005em;
        cursor: pointer;
        transition: background .16s ease, border-color .16s ease, transform .16s ease;
      }

      button:hover { background: #fff; border-color: rgba(43,105,99,.34); }
      button:active { transform: translateY(1px); }
      button:focus-visible, input:focus-visible { outline: 3px solid rgba(67, 191, 179, .4); outline-offset: 2px; }
      button:disabled { opacity: .48; cursor: wait; }
      #record { color: #fff; border-color: #218e85; background: #218e85; }
      #record:hover { background: #167a72; }

      input[type="range"] {
        width: 100%;
        accent-color: #35b9ad;
        cursor: pointer;
      }

      .readout {
        min-width: 78px;
        color: var(--muted);
        font: 600 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        text-align: right;
        white-space: nowrap;
      }

      .note {
        min-height: 15px;
        margin-top: 2px;
        color: #69837f;
        font: 11px/1.35 Inter, ui-sans-serif, system-ui, sans-serif;
        text-align: right;
      }

      @media (max-width: 620px) {
        body { justify-content: flex-start; padding: 18px 10px 12px; }
        .player { width: 100%; }
        .frame { border-radius: 8px; }
        .controls { grid-template-columns: repeat(4, auto); gap: 6px; }
        button { padding: 0 10px; min-height: 36px; font-size: 12px; }
        input[type="range"] { grid-column: 1 / 5; grid-row: 2; }
        .readout { grid-column: 5 / 7; grid-row: 1; }
        .note { text-align: left; }
      }
    </style>
  </head>
  <body>
    <main class="player">
      <div class="frame">
        <canvas id="stage" width="1920" height="1080" aria-label="Zoan mobile product showreel, five seconds"></canvas>
      </div>
      <div class="controls" aria-label="Playback controls">
        <button id="play" type="button">Play</button>
        <button id="pause" type="button">Pause</button>
        <button id="restart" type="button">Restart</button>
        <button id="record" type="button">Record 5s</button>
        <input id="scrub" type="range" min="0" max="5" step="0.01" value="0" aria-label="Seek showreel timeline" />
        <output class="readout" id="readout">0.00s · beat 1/10</output>
      </div>
      <div class="note" id="note" aria-live="polite">1920 × 1080 · 16:9 · 5s · Zoan UI kept intact</div>
    </main>

        const expoOut = (p) => 1 - Math.pow(2, -10 * clamp(p));

        // Closed-form underdamped spring: the same t always produces the same value.
        function spring01(p, damping = 0.82, omega = 10.5) {
          const t = clamp(p) * 1.18;
          const wd = omega * Math.sqrt(1 - damping * damping);
          const response = 1 - Math.exp(-damping * omega * t) *
            (Math.cos(wd * t) + (damping * omega / wd) * Math.sin(wd * t));
          const end = 1 - Math.exp(-damping * omega * 1.18) *
            (Math.cos(wd * 1.18) + (damping * omega / wd) * Math.sin(wd * 1.18));
          return response / end;
        }

        function roundRect(x, y, w, h, r) {
          const radius = Math.min(r, w / 2, h / 2);
          ctx.beginPath();
          ctx.moveTo(x + radius, y);
          ctx.arcTo(x + w, y, x + w, y + h, radius);
          ctx.arcTo(x + w, y + h, x, y + h, radius);
          ctx.arcTo(x, y + h, x, y, radius);
          ctx.arcTo(x, y, x + w, y, radius);
          ctx.closePath();
        }

        function drawBackground(t) {
          ctx.fillStyle = CAMPAIGN.colors.canvas;
          ctx.fillRect(0, 0, WIDTH, HEIGHT);

          // Soft brand-color fields and fine orbit lines, kept low contrast.
          ctx.fillStyle = "rgba(176, 241, 237, .28)";
          ctx.beginPath();
          ctx.ellipse(1030, 548, 430, 520, -.15, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(255, 255, 255, .54)";
          ctx.beginPath();
          ctx.ellipse(1070, 527, 310, 420, -.15, 0, Math.PI * 2);
          ctx.fill();

          ctx.save();
          ctx.translate(850, 540);
          ctx.rotate(-.12 + .012 * Math.sin(t * .6));
          ctx.strokeStyle = "rgba(45, 160, 151, .10)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(0, 0, 700, 352, 0, -.22, Math.PI * 1.72);
          ctx.stroke();
          ctx.strokeStyle = "rgba(255, 255, 255, .58)";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.ellipse(0, 0, 790, 414, 0, .16, Math.PI * 1.66);
          ctx.stroke();
          ctx.restore();

          // Stable floor shadow gives the device a physical anchor.
          const shadow = ctx.createRadialGradient(1100, 990, 12, 1100, 990, 440);
          shadow.addColorStop(0, "rgba(36, 83, 79, .19)");
          shadow.addColorStop(1, "rgba(36, 83, 79, 0)");
          ctx.fillStyle = shadow;
          ctx.fillRect(650, 875, 900, 210);
        }

        function drawPhone(t) {
          const settle = expoOut(t / 2.5);
          const push = smooth(1.75, 3.45, t);
          const scale = lerp(.94, 1.025, push);
          const angle = lerp(-.04, -.018, settle);
          const phoneX = 1090;
          const phoneY = 540 + lerp(18, 0, settle);
          const outerW = 438;
          const outerH = 950;
          const screenX = -207;
          const screenY = -444;
          const screenW = 414;
          const screenH = 888;

          ctx.save();
          ctx.translate(phoneX, phoneY);
          ctx.rotate(angle);
          ctx.scale(scale, scale);
          ctx.transform(1, 0, lerp(.052, .028, settle), 1, 0, 0);

          // Polished metal body with a narrow, visible side edge.
          ctx.save();
          ctx.shadowColor = "rgba(21, 64, 60, .24)";
          ctx.shadowBlur = 58;
          ctx.shadowOffsetX = 4;
          ctx.shadowOffsetY = 38;
          roundRect(-outerW / 2, -outerH / 2, outerW, outerH, 54);
          const metal = ctx.createLinearGradient(-outerW / 2, 0, outerW / 2, 0);
          metal.addColorStop(0, "#899695");
          metal.addColorStop(.035, "#f8fcfb");
          metal.addColorStop(.10, "#aeb9b8");
          metal.addColorStop(.18, "#fdfefe");
          metal.addColorStop(.78, "#e3eae9");
          metal.addColorStop(.94, "#a2adac");
          metal.addColorStop(1, "#f7fbfa");
          ctx.fillStyle = metal;
          ctx.fill();
          ctx.restore();

          roundRect(-outerW / 2, -outerH / 2, outerW, outerH, 54);
          ctx.strokeStyle = "rgba(50, 65, 64, .54)";
          ctx.lineWidth = 2;
          ctx.stroke();

          // Screen contents and the insertion point sit inside the same transformed camera plane.
          ctx.save();
          roundRect(screenX, screenY, screenW, screenH, 39);
          ctx.clip();
          ctx.fillStyle = "#fff";
          ctx.fillRect(screenX, screenY, screenW, screenH);
          if (homeImage.complete && homeImage.naturalWidth) {
            ctx.drawImage(homeImage, screenX, screenY, screenW, screenH);
          }

          // Splash slides away to reveal the real Home screenshot, avoiding a dissolve.
          const splashProgress = smooth(.58, .96, t);
          if (splashProgress < 1) {
            const splashY = screenY - screenH * splashProgress;
            const splashGrad = ctx.createLinearGradient(screenX, splashY, screenX + screenW, splashY + screenH);
            splashGrad.addColorStop(0, "#c8f8f3");
            splashGrad.addColorStop(.56, "#a8eee9");
            splashGrad.addColorStop(1, "#c1f7ef");
            ctx.fillStyle = splashGrad;
            ctx.fillRect(screenX, splashY, screenW, screenH);

            const logoAlpha = 1 - smooth(.47, .82, t);
            if (logoAlpha > 0 && logoImage.complete && logoImage.naturalWidth) {
              ctx.globalAlpha = logoAlpha;
              const logoSize = 82;
              const logoY = splashY + screenH * .5 - logoSize / 2;
              ctx.drawImage(logoImage, -logoSize / 2, logoY, logoSize, logoSize);
              ctx.globalAlpha = 1;
            }
          }

          // The original banner is isolated from the Home screenshot and flies into this exact slot.
          const cardX = screenX + screenW * .0385;
          const cardY = screenY + screenH * .1313;
          const cardW = screenW * .92;
          const cardH = cardW * (285 / 550);
          const flight = spring01((t - CAMPAIGN.motion.cardStart) / CAMPAIGN.motion.cardTravel, .82, 5.5);
          const cardAlpha = smooth(1.02, 1.17, t);
          // One muted reflection pass across the glass; no flare or glow.
          const glint = smooth(2.45, 2.75, t) * (1 - smooth(3.15, 3.48, t));
          if (glint > 0) {
            ctx.save();
            roundRect(screenX, screenY, screenW, screenH, 39);
            ctx.clip();
            const x = lerp(screenX - 260, screenX + screenW + 260, smooth(2.45, 3.28, t));
            const stripe = ctx.createLinearGradient(x - 85, 0, x + 85, 0);
            stripe.addColorStop(0, "rgba(255,255,255,0)");
            stripe.addColorStop(.5, `rgba(255,255,255,${.20 * glint})`);
            stripe.addColorStop(1, "rgba(255,255,255,0)");
            ctx.fillStyle = stripe;
            ctx.fillRect(x - 110, screenY, 220, screenH);
            ctx.restore();
          }
          ctx.restore();

          // Draw the card outside the screen clip so it can travel in front of the device.
          if (cardAlpha > 0 && cardImage.complete && cardImage.naturalWidth) {
            const p = clamp(flight, 0, 1.025);
            const x = lerp(cardX - 505, cardX, p);
            const y = lerp(cardY + 425, cardY, p);
            const cardScale = lerp(.59, 1, clamp(p));
            const turn = lerp(.31, 0, clamp(p));
            const speedBlur = Math.max(0, 5.5 * (4 * clamp(p) * (1 - clamp(p))));

            ctx.save();
            ctx.globalAlpha = cardAlpha;
            ctx.translate(x, y);
            ctx.rotate(turn);
            ctx.scale(cardScale, cardScale);
            ctx.filter = speedBlur > .1 ? `blur(${speedBlur}px)` : "none";
            ctx.shadowColor = "rgba(19, 54, 51, .25)";
            ctx.shadowBlur = 28;
            ctx.shadowOffsetY = 18;
            ctx.drawImage(cardImage, 0, 0, cardW, cardH);
            ctx.restore();
          }

          // Hairline highlight around the screen edge.
          roundRect(screenX, screenY, screenW, screenH, 39);
          ctx.strokeStyle = "rgba(32, 48, 47, .35)";
          ctx.lineWidth = 2;
          ctx.stroke();

          // Side keys add thickness without adding a second device or extra UI.
          ctx.fillStyle = "#9da8a7";
          roundRect(outerW / 2 - 1, -outerH * .29, 5, outerH * .12, 3);
          ctx.fill();
          roundRect(-outerW / 2 - 3, -outerH * .19, 4, outerH * .08, 2);
          ctx.fill();
          ctx.restore();
        }

        window.seek = function seek(time) {
          const t = clamp(Number(time) || 0, 0, DURATION);
          drawBackground(t);
          drawPhone(t);
          scrub.value = String(t);
          const beat = Math.min(10, Math.floor(t * 2) + 1);
          readout.textContent = `${t.toFixed(2)}s · beat ${beat}/10`;
          return t;
        };

        let isPlaying = false;
        let isRecording = false;
        let startTime = 0;
        let pausedAt = 0;
        let animationFrame = 0;
        let audioContext = null;
        let audioDestination = null;
        let audioBufferPromise = null;
        let audioSource = null;
        let recorder = null;
        let recordedChunks = [];

        function getAudioContext() {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) throw new Error("Web Audio is unavailable in this browser.");
          if (!audioContext) {
            audioContext = new AudioContextClass();
            audioDestination = audioContext.createMediaStreamDestination();
          }
          return audioContext;
        }

        async function buildSoundtrack() {
          if (audioBufferPromise) return audioBufferPromise;
          audioBufferPromise = (async () => {
            const OfflineContext = window.OfflineAudioContext || window.webkitOfflineAudioContext;
            if (!OfflineContext) return null;
            const rate = 48000;
            const offline = new OfflineContext(2, rate * DURATION, rate);

            function tone(at, duration, startHz, endHz, gainAmount, type = "sine") {
              const oscillator = offline.createOscillator();
              const gain = offline.createGain();
              oscillator.type = type;
              oscillator.frequency.setValueAtTime(startHz, at);
              oscillator.frequency.exponentialRampToValueAtTime(Math.max(1, endHz), at + duration);
              gain.gain.setValueAtTime(.0001, at);
              gain.gain.exponentialRampToValueAtTime(gainAmount, at + .012);
              gain.gain.exponentialRampToValueAtTime(.0001, at + duration);
              oscillator.connect(gain);
              gain.connect(offline.destination);
              oscillator.start(at);
              oscillator.stop(at + duration + .01);
            }

            // 120 BPM pulse: a restrained low kick each half-second, with accents at the card landing.
            const beatCount = Math.round(DURATION * CAMPAIGN.bpm / 60);
            for (let beat = 0; beat < beatCount; beat += 1) {
              const at = beat * 60 / CAMPAIGN.bpm;
              tone(at, .16, 88, 39, beat === 4 ? .19 : .13, "sine");
              if (beat === 3 || beat === 4 || beat === 6) tone(at, .12, 920, 560, .035, "triangle");
            }
            // A soft, pitched sweep under the card movement, made without sampled or licensed audio.
            tone(1.08, .8, 150, 520, .025, "sine");
            return offline.startRendering();
          })();
          return audioBufferPromise;
        }

        function stopAudioSource() {
          if (!audioSource) return;
          try { audioSource.stop(); } catch (_) { /* already stopped */ }
          try { audioSource.disconnect(); } catch (_) { /* already disconnected */ }
          audioSource = null;
        }

        async function startAudioAt(offset) {
          const buffer = await buildSoundtrack();
          if (!buffer) return;
          const audio = getAudioContext();
          if (audio.state === "suspended") await audio.resume();
          stopAudioSource();
          audioSource = audio.createBufferSource();
          audioSource.buffer = buffer;
          audioSource.connect(audio.destination);
          audioSource.connect(audioDestination);
          audioSource.start(0, clamp(offset, 0, DURATION));
        }

        function currentTime() {
          return isPlaying ? clamp((performance.now() - startTime) / 1000, 0, DURATION) : pausedAt;
        }

        function tick() {
          if (!isPlaying) return;
          const t = currentTime();
          window.seek(t);
          if (t >= DURATION) {
            isPlaying = false;
            pausedAt = DURATION;
            stopAudioSource();
            if (isRecording && recorder && recorder.state !== "inactive") recorder.stop();
            syncControls();
            return;
          }
          animationFrame = requestAnimationFrame(tick);
        }

        function syncControls() {
          playButton.disabled = isRecording;
          pauseButton.disabled = isRecording || !isPlaying;
          restartButton.disabled = isRecording;
          recordButton.disabled = isRecording;
        }

        async function playFrom(time = pausedAt) {
          if (isRecording || isPlaying) return;
          const t = clamp(time, 0, DURATION);
          if (t >= DURATION) {
            pausedAt = 0;
            window.seek(0);
          }
          const offset = t >= DURATION ? 0 : t;
          await startAudioAt(offset);
          pausedAt = offset;
          startTime = performance.now() - offset * 1000;
          isPlaying = true;
          syncControls();
          cancelAnimationFrame(animationFrame);
          animationFrame = requestAnimationFrame(tick);
        }

        function pause() {
          if (!isPlaying || isRecording) return;
          pausedAt = currentTime();
          isPlaying = false;
          stopAudioSource();
          cancelAnimationFrame(animationFrame);
          window.seek(pausedAt);
          syncControls();
        }

        function restart() {
          if (isRecording) return;
          isPlaying = false;
          stopAudioSource();
          cancelAnimationFrame(animationFrame);
          pausedAt = 0;
          window.seek(0);
          syncControls();
        }

        function recorderType() {
          const choices = [
            ["video/mp4;codecs=avc1.42E01E,mp4a.40.2", "mp4"],
            ["video/mp4", "mp4"],
            ["video/webm;codecs=vp9,opus", "webm"],
            ["video/webm;codecs=vp8,opus", "webm"],
            ["video/webm", "webm"]
          ];
          for (const [mime, extension] of choices) {
            if (MediaRecorder.isTypeSupported(mime)) return { mime, extension };
          }
          return null;
        }

        async function recordCycle() {
          if (isRecording || !canvas.captureStream || !window.MediaRecorder) {
            note.textContent = "Recording is not supported by this browser.";
            return;
          }
          const type = recorderType();
          if (!type) {
            note.textContent = "This browser does not report a supported MP4 or WebM recorder.";
            return;
          }
          try {
            const buffer = await buildSoundtrack();
            if (!buffer) throw new Error("Offline Web Audio is unavailable.");
            const audio = getAudioContext();
            if (audio.state === "suspended") await audio.resume();
            restart();
            const videoStream = canvas.captureStream(FPS);
            const combined = new MediaStream([
              ...videoStream.getVideoTracks(),
              ...audioDestination.stream.getAudioTracks()
            ]);
            recordedChunks = [];
            recorder = new MediaRecorder(combined, { mimeType: type.mime });
            recorder.ondataavailable = (event) => {
              if (event.data && event.data.size) recordedChunks.push(event.data);
            };
            recorder.onstop = () => {
              const blob = new Blob(recordedChunks, { type: type.mime });
              const url = URL.createObjectURL(blob);
              const link = document.createElement("a");
              link.href = url;
              link.download = `zoan-mobile-showreel.${type.extension}`;
              link.click();
              setTimeout(() => URL.revokeObjectURL(url), 30000);
              videoStream.getTracks().forEach((track) => track.stop());
              combined.getTracks().forEach((track) => track.stop());
              isRecording = false;
              note.textContent = `Saved one 5-second ${type.extension.toUpperCase()} cycle with generated audio.`;
              syncControls();
            };
            recorder.start(100);
            isRecording = true;
            pausedAt = 0;
            startTime = performance.now();
            await startAudioAt(0);
            syncControls();
            note.textContent = `Recording one 5-second cycle as ${type.extension.toUpperCase()}…`;
            animationFrame = requestAnimationFrame(tick);
          } catch (error) {
            isRecording = false;
            syncControls();
            note.textContent = error && error.message ? error.message : "Could not start recording.";
          }
        }

        playButton.addEventListener("click", () => playFrom(pausedAt));
        pauseButton.addEventListener("click", pause);
        restartButton.addEventListener("click", restart);
        recordButton.addEventListener("click", recordCycle);
        scrub.addEventListener("input", () => {
          if (isPlaying) pause();
          pausedAt = Number(scrub.value);
          window.seek(pausedAt);
        });

        Promise.all([homeImage.decode(), cardImage.decode(), logoImage.decode()])
          .catch(() => undefined)
          .finally(() => {
            const requestedTime = new URLSearchParams(location.search).get("t");
            pausedAt = requestedTime === null ? 0 : clamp(Number(requestedTime), 0, DURATION);
            window.seek(pausedAt);
          });

        syncControls();
      })();
    </script>
  </body>
</html>

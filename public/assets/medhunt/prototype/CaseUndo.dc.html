<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Huỷ lần ghi gần nhất của ca tuyển</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}.cu{width:min(520px,94vw)}.cu .box{border:1px solid var(--line-soft);border-radius:12px;background:var(--surface-2);padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:13px}.cu .box b{font-weight:600}.cu .blk{border-radius:12px;background:var(--danger-soft);color:var(--danger-ink);padding:10px 14px;font-size:13px}</style></helmet>
<div class="scrim"><div class="modal anim-scale cu" role="dialog" aria-label="Huỷ lần ghi gần nhất">
  <h2 style="margin:0">Huỷ lần ghi gần nhất</h2>
  <div class="muted small">Dùng khi ghi nhầm. Ca quay về trạng thái ngay trước lần ghi này; lần ghi bị huỷ vẫn nằm trong nhật ký.</div>
  <div class="box"><span class="muted">Lần ghi gần nhất · {{info.at}}</span><b>{{info.text}}</b><span>Ca sẽ quay về: <b>{{info.back}}</b></span></div>
  <sc-if value="{{info.err}}"><div class="blk" role="alert">{{info.err}}</div></sc-if>
  <div class="field"><label>Lý do huỷ <span class="req">*</span></label><input class="input" value="{{reason}}" placeholder="VD: Ghi nhầm ứng viên, khách báo cho người khác" disabled="{{info.err}}" onInput="{{onReason}}"><span class="err">{{err}}</span></div>
  <div class="row"><span class="spacer"></span><button class="btn" onClick="{{close}}">Đóng</button><button class="btn danger" disabled="{{info.err}}" onClick="{{save}}">Huỷ lần ghi</button></div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"info":{"editor":null,"default":{"text":"","at":"","back":"","err":""}},"onSave":{"editor":null},"onClose":{"editor":null},"$preview":{"width":560,"height":420}}'>
class Component extends DCLogic {
  state = { reason: '', err: '' };
  renderVals() {
    const P = this.props, S = this.state;
    return { info: P.info || {}, reason: S.reason, err: S.err, onReason: (ev) => this.setState({ reason: ev.target.value, err: '' }), close: P.onClose,
      save: () => { if (!S.reason.trim()) { this.setState({ err: 'Nhập lý do huỷ (ERR-PIP-15).' }); return; } P.onSave && P.onSave(S.reason.trim()); } };
  }
}
</script>
</body>
</html>

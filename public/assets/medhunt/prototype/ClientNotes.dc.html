<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ghi chú khách hàng</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./english-dictionary.js"></script>
<script src="./english-ui.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}.nt-r{display:flex;gap:12px;align-items:flex-start;padding:12px 24px;border-top:1px solid var(--line-soft)}.nt-r p{margin:0;white-space:pre-line}.nt-m{font-size:12px;color:var(--muted)}</style></helmet>
<div class="card"><div class="card-h"><h3>Ghi chú</h3><span class="muted small">Ghi chú nội bộ, chỉ nhân viên SMS thấy, không hiện trên cổng khách hàng.</span></div>
  <div class="card-b col"><textarea class="input" style="height:72px;padding:8px 12px" aria-label="Ghi chú mới" placeholder="Ghi chú về khách hàng…" value="{{text}}" onInput="{{onText}}"></textarea>
    <div class="row"><span class="err">{{err}}</span><span class="spacer"></span><button class="btn sm primary" onClick="{{add}}">Thêm ghi chú</button></div></div>
  <sc-for list="{{rows}}" as="n"><div class="nt-r"><div style="flex:1;min-width:0"><p>{{n.text}}</p><div class="nt-m">{{n.by}} · {{n.at}}</div></div><sc-if value="{{n.mine}}"><button class="btn sm danger" onClick="{{n.del}}">Xoá</button></sc-if></div></sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"notes":{"editor":null,"default":[]},"actor":{"editor":null},"onAdd":{"editor":null},"onDelete":{"editor":null},"$preview":{"width":900,"height":300}}'>
class Component extends DCLogic {
  // Chỉ xoá được ghi chú của chính mình (M3 B5)
  state = { text: '', err: '' };
  renderVals() {
    const S = this.state, P = this.props;
    return { text: S.text, err: S.err, onText: (e) => this.setState({ text: e.target.value, err: '' }),
      add: () => { const t = S.text.trim(); if (!t) { this.setState({ err: 'Nhập nội dung ghi chú.' }); return; } P.onAdd && P.onAdd(t); this.setState({ text: '', err: '' }); },
      rows: (P.notes || []).map((n) => ({ ...n, mine: n.by === P.actor, del: () => P.onDelete && P.onDelete(n.id) })) };
  }
}
</script>
</body>
</html>

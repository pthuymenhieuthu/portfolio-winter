<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hoạt động khách hàng</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./english-dictionary.js"></script>
<script src="./english-ui.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}.ac-f{display:flex;flex-wrap:wrap;gap:8px;padding:14px 24px;border-bottom:1px solid var(--line-soft)}.ac-r{display:flex;gap:12px;align-items:baseline;padding:10px 24px;border-top:1px solid var(--line-soft)}.ac-r:first-of-type{border-top:0}</style></helmet>
<div class="card"><div class="card-h"><h3>Dòng hoạt động</h3><span class="muted small">{{count}}</span></div>
  <div class="ac-f"><div class="dh-tabs" role="group" aria-label="Nhóm hoạt động"><sc-for list="{{groups}}" as="g"><button aria-pressed="{{g.on}}" onClick="{{g.pick}}">{{g.label}}</button></sc-for></div></div>
  <sc-for list="{{rows}}" as="a"><div class="ac-r"><span class="chip gray tabular">{{a.at}}</span><span class="{{a.tone}}">{{a.groupLabel}}</span><span>{{a.text}}</span></div></sc-for>
  <sc-if value="{{empty}}"><div class="card-b muted">Chưa có hoạt động nào.</div></sc-if>
  <sc-if value="{{more}}"><div class="card-b"><button class="btn sm" onClick="{{showMore}}">Xem thêm {{moreN}}</button></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"events":{"editor":null,"default":[]},"$preview":{"width":900,"height":300}}'>
class Component extends DCLogic {
  static G = { all: 'Tất cả', customer: 'Khách hàng', request: 'Yêu cầu', note: 'Ghi chú' };
  static SIZE = 10; // số sự kiện hiện mỗi lần; "Xem thêm" mở thêm từng lượt
  state = { g: 'all', n: 10 };
  renderVals() {
    const S = this.state, C = Component, all = this.props.events || [], list = S.g === 'all' ? all : all.filter((e) => e.group === S.g);
    const shown = list.slice(0, S.n);
    return { count: list.length + ' sự kiện', rows: shown.map((e) => ({ ...e, groupLabel: C.G[e.group], tone: e.group === 'note' ? 'chip warn' : e.group === 'request' ? 'chip info' : 'chip gray' })), empty: list.length === 0,
      groups: Object.keys(C.G).map((k) => ({ label: C.G[k], on: S.g === k, pick: () => this.setState({ g: k, n: C.SIZE }) })), more: list.length > S.n, moreN: Math.min(C.SIZE, list.length - S.n), showMore: () => this.setState({ n: S.n + C.SIZE }) };
  }
}
</script>
</body>
</html>

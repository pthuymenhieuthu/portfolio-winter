<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thanh lọc danh sách</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./filter-multi.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet><style>
body{margin:0}
.fb{position:relative;flex:1 1 auto;min-width:0}
.fb-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.fb-search{position:relative;flex:none;width:300px;max-width:100%}.fb-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--subtle);pointer-events:none}.fb-search .input{padding-left:36px}
.fb-n{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--brand);color:var(--on-brand);font-size:11px;font-weight:700}
.fb-chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-left:auto;justify-content:flex-end}
.fb-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 4px 3px 12px;border-radius:999px;background:var(--brand-50);color:var(--brand-ink);font-size:12.5px;font-weight:600}
.fb-chip button{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:0;border-radius:50%;background:none;color:inherit;cursor:pointer}.fb-chip button:hover{background:var(--brand-100)}
.fb-back{position:fixed;inset:0;z-index:30}
.fb-panel{position:absolute;left:0;top:calc(100% + 6px);z-index:31;width:min(560px,calc(100vw - 48px));display:flex;flex-direction:column;gap:12px;padding:14px 16px}/* Khung lọc nổi trên bảng trắng nên cần viền xám và bóng đổ để tách khỏi nền, dù thẻ kiểu phẳng không có bóng */
.fb-panel.card{overflow:visible;border:1px solid var(--line);box-shadow:0 22px 50px -16px rgba(16,24,40,.32),0 2px 6px rgba(16,24,40,.06)}
.fb-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}.fb-f{display:flex;flex-direction:column;gap:4px;min-width:0}.fb-f.wide{grid-column:1/-1}
.fb-lb,.fb-fh{font-size:12.5px;font-weight:600;color:var(--ink-2)}.fb-fh{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.fb-q{height:36px}
.fb-panel .input:not(.fb-q){height:38px}
/* Danh sách chọn: hiện tối đa 7 hàng (34px một hàng), nhiều hơn thì cuộn; quá 7 giá trị mới có ô tìm */
.fb-dd{position:relative}.fb-sel{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;cursor:pointer}.fb-sel svg{flex:none;color:var(--muted)}.fb-sel span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fb-sel .ph{color:var(--subtle)}
.fb-ddback{position:fixed;inset:0;z-index:4}
.fb-menu{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:12px;background:var(--surface);box-shadow:0 0 0 1px var(--line),0 14px 32px -10px rgba(16,24,40,.28)}
.fb-list{max-height:238px;overflow-y:auto;display:flex;flex-direction:column}
.fb-o{display:flex;flex:none;align-items:center;gap:10px;min-height:34px;padding:0 10px;border-radius:8px;font-size:13px;color:var(--ink);cursor:pointer}.fb-o:hover{background:var(--surface-2)}.fb-o input{width:16px;height:16px;margin:0;flex:none}
.fb-none{padding:10px;color:var(--muted);font-size:13px}
.fb-di{position:relative}.fb-di .input{padding-right:44px}
.fb-cal{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;color:var(--muted);overflow:hidden;cursor:pointer}.fb-cal:hover{background:var(--brand-50);color:var(--brand-ink)}
.fb-nat{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.fb-nat::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.fb .input{border:1px solid #d3d9e0;background:#f6f7f9;box-shadow:none}.fb .input:hover{border-color:#b9c1cc}.fb .input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}.fb .fb-sel[aria-expanded="true"]{border-color:var(--brand);background:#fff}
.fb-pre{flex-direction:row!important;flex-wrap:wrap;gap:6px}.fb-p{height:26px;padding:0 12px;border:1px solid #d3d9e0;border-radius:999px;background:#f6f7f9;font:inherit;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}.fb-p:hover{border-color:var(--brand-300);background:#fff}.fb-p.on{border-color:var(--brand);background:var(--brand-50);color:var(--brand-ink)}
.fb-foot{display:flex;justify-content:flex-end;gap:8px}
@media(max-width:640px){.fb-grid{grid-template-columns:minmax(0,1fr)}.fb-chips{margin-left:0;justify-content:flex-start}}
</style></helmet>
<div class="fb">
  <div class="fb-bar">
    <div class="fb-search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="input" placeholder="{{placeholder}}" value="{{q}}" onInput="{{onQ}}" aria-label="{{placeholder}}"></div>
    <button class="btn" aria-expanded="{{open}}" onClick="{{toggle}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>Lọc<sc-if value="{{hasN}}"><span class="fb-n">{{n}}</span></sc-if></button>
    <div class="fb-chips"><sc-for list="{{chips}}" as="c"><span class="fb-chip">{{c.text}}<button aria-label="Bỏ lọc {{c.text}}" onClick="{{c.clear}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></span></sc-for>
      <sc-if value="{{hasChips}}"><button class="btn sm" onClick="{{clearAll}}">Xoá lọc</button></sc-if></div>
  </div>
  <sc-if value="{{open}}"><div class="fb-back" onClick="{{close}}" aria-hidden="true"></div>
    <div class="fb-panel card anim-pop" role="dialog" aria-label="Bộ lọc">
      <div class="fb-grid"><sc-for list="{{panel}}" as="f"><div class="{{f.cls}}">
        <sc-if value="{{f.isList}}"><div class="fb-fh">{{f.label}}<sc-if value="{{f.dn}}"><span class="fb-n">{{f.dn}}</span></sc-if></div></sc-if>
        <sc-if value="{{f.isList}}"><div class="fb-dd"><button type="button" class="input fb-sel" aria-haspopup="listbox" aria-expanded="{{f.ddOpen}}" aria-label="{{f.label}}" onClick="{{f.toggleDd}}"><span class="{{f.sumCls}}">{{f.summary}}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
          <sc-if value="{{f.ddOpen}}"><div class="fb-ddback" onClick="{{closeDd}}" aria-hidden="true"></div><div class="fb-menu"><sc-if value="{{f.searchable}}"><input class="input fb-q" placeholder="Tìm {{f.label}}" aria-label="Tìm trong {{f.label}}" value="{{f.fq}}" onInput="{{f.onSearch}}"></sc-if>
            <div class="fb-list" role="listbox" aria-multiselectable="true" aria-label="{{f.label}}"><sc-for list="{{f.opts}}" as="o"><label class="fb-o"><input type="checkbox" checked="{{o.on}}" onChange="{{o.toggle}}"><span>{{o.l}}</span></label></sc-for><sc-if value="{{f.none}}"><span class="fb-none">Không tìm thấy kết quả</span></sc-if></div></div></sc-if></div></sc-if>
        <sc-if value="{{f.isDate}}"><div class="fb-grid"><sc-if value="{{f.hasPresets}}"><div class="fb-pre fb-f wide" role="group" aria-label="Chọn nhanh khoảng ngày"><sc-for list="{{f.presets}}" as="pr"><button type="button" class="{{pr.cls}}" aria-pressed="{{pr.on}}" onClick="{{pr.pick}}">{{pr.label}}</button></sc-for></div></sc-if>
          <label class="fb-f"><span class="fb-lb">{{f.fromLabel}}</span><span class="fb-di"><input class="input" inputmode="numeric" maxlength="10" placeholder="dd/mm/yyyy" aria-label="{{f.fromLabel}}" value="{{f.from.v}}" onInput="{{f.from.onInput}}"><span class="fb-cal" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/></svg><input type="date" class="fb-nat" tabindex="-1" aria-label="Chọn ngày bắt đầu" value="{{f.from.iso}}" onChange="{{f.from.pick}}"></span></span></label>
          <label class="fb-f"><span class="fb-lb">{{f.toLabel}}</span><span class="fb-di"><input class="input" inputmode="numeric" maxlength="10" placeholder="dd/mm/yyyy" aria-label="{{f.toLabel}}" value="{{f.to.v}}" onInput="{{f.to.onInput}}"><span class="fb-cal" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/></svg><input type="date" class="fb-nat" tabindex="-1" aria-label="Chọn ngày kết thúc" value="{{f.to.iso}}" onChange="{{f.to.pick}}"></span></span></label>
          <sc-if value="{{f.hasErr}}"><span class="err fb-f wide">{{f.dateErr}}</span></sc-if></div></sc-if>
      </div></sc-for></div>
      <div class="fb-foot"><button class="btn" onClick="{{draftClear}}">Xoá lọc</button><button class="btn primary" disabled="{{bad}}" onClick="{{apply}}">Áp dụng</button></div>
    </div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"fields":{"editor":null,"default":[]},"q":{"editor":null,"default":""},"placeholder":{"editor":null,"default":"Tìm…"},"onQ":{"editor":null},"onApply":{"editor":null},"$preview":{"width":900,"height":60}}'>
class Component extends DCLogic {
  // Bảng Lọc theo code gốc: chỉnh nháp trong bảng, bấm Áp dụng mới lọc; giá trị đang lọc hiện thành chip có dấu × ở ngoài thanh công cụ
  state = { open: false, dd: '', draft: {}, fq: {} };
  renderVals() {
    const P = this.props, S = this.state, MF = window.MedFilter, fields = P.fields || [];
    // Hơn 7 giá trị thì danh sách chỉ hiện 7 hàng, kéo xuống để xem tiếp và có ô tìm
    const SHOW_ROWS = 7;
    const cur = (f) => f.sel, blank = (f) => (f.date ? { from: '', to: '' } : []), on = (f, v) => (f.date ? !!(v.from || v.to) : v.length > 0);
    const extras = Object.assign({}, ...fields.map((f) => f.extra || {}));
    const emit = (patch) => P.onApply && P.onApply({ ...patch, ...extras });
    const nameOf = (f, v) => (f.opts.find(([k]) => k === v) || [v, v])[1];
    const chips = fields.flatMap((f) => { const v = cur(f); if (!on(f, v)) return [];
      if (f.date) return [{ text: f.label + ': ' + (v.from || '…') + ' – ' + (v.to || '…'), clear: () => emit({ [f.key]: blank(f) }) }];
      // Mỗi bộ lọc một chip kèm số giá trị đã chọn ("Nhóm khách hàng: 2"); bộ lọc chỉ chọn một giá trị thì hiện chính giá trị đó
      return [{ text: f.label + ': ' + (f.single ? nameOf(f, v[0]) : v.length), clear: () => emit({ [f.key]: [] }) }]; });
    const nActive = fields.filter((f) => on(f, cur(f))).length;
    const draftOf = (f) => (S.draft[f.key] !== undefined ? S.draft[f.key] : cur(f));
    const setDraft = (key, v) => this.setState({ draft: { ...S.draft, [key]: v } });
    const panel = fields.map((f) => { const v = draftOf(f);
      if (f.date) return { key: f.key, label: f.label, cls: 'fb-f wide', isDate: true, isList: false, dn: '', ...MF.dateFields(v, (patch) => setDraft(f.key, { ...v, ...patch })), fromLabel: f.fromLabel, toLabel: f.toLabel, hasPresets: (f.presets || []).length > 0,
        presets: (f.presets || []).map((pr) => { const on = v.from === pr.from && v.to === pr.to; return { label: pr.label, on, cls: 'fb-p' + (on ? ' on' : ''), pick: () => setDraft(f.key, { from: pr.from, to: pr.to }) }; }) };
      const q = (S.fq[f.key] || '').trim().toLocaleLowerCase('vi'), searchable = f.opts.length > SHOW_ROWS;
      const shown = searchable && q ? f.opts.filter(([, l]) => String(l).toLocaleLowerCase('vi').includes(q)) : f.opts;
      return { key: f.key, label: f.label, cls: 'fb-f', isDate: false, isList: true, searchable, fq: S.fq[f.key] || '', onSearch: (e) => this.setState({ fq: { ...S.fq, [f.key]: e.target.value } }), none: shown.length === 0, dn: v.length ? String(v.length) : '', ddOpen: S.dd === f.key, toggleDd: () => this.setState({ dd: S.dd === f.key ? '' : f.key, fq: { ...S.fq, [f.key]: '' } }),
        summary: v.length ? v.map((x) => nameOf(f, x)).join(', ') : 'Tất cả', sumCls: v.length ? '' : 'ph',
        opts: shown.map(([val, l]) => { const sel = v.includes(val); return { l, on: sel, toggle: () => setDraft(f.key, f.single ? (sel ? [] : [val]) : (sel ? v.filter((x) => x !== val) : [...v, val])) }; }) }; });
    const bad = panel.some((f) => f.hasErr);
    const all = (fn) => Object.fromEntries(fields.map((f) => [f.key, fn(f)]));
    return { q: P.q || '', placeholder: P.placeholder || 'Tìm…', onQ: P.onQ, open: S.open, n: nActive, hasN: nActive > 0, chips, hasChips: chips.length > 0, panel, bad,
      toggle: () => this.setState(S.open ? { open: false, dd: '' } : { open: true, dd: '', fq: {}, draft: all(cur) }), close: () => this.setState({ open: false, dd: '' }), closeDd: () => this.setState({ dd: '' }),
      clearAll: () => emit(all(blank)), draftClear: () => this.setState({ draft: all(blank) }), apply: () => { if (bad) return; emit(all(draftOf)); this.setState({ open: false, dd: '' }); } };
  }
}
</script>
</body>
</html>

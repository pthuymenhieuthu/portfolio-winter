<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Hợp đồng khách hàng</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="card"><div class="card-h"><h3>Hợp đồng</h3><span class="muted small">{{sub}}</span></div>
  <sc-if value="{{hasRows}}"><table class="dh-table"><thead><tr><th>Số hợp đồng</th><th>Trạng thái</th><th>Ngày ký</th><th>Gắn với yêu cầu</th><th></th></tr></thead><tbody>
    <sc-for list="{{rows}}" as="k"><tr><td class="fw5">{{k.no}}</td><td><span class="{{k.chip}}">{{k.label}}</span></td><td class="tabular muted">{{k.date}}</td><td><button class="btn sm" onClick="{{k.open}}">{{k.req}} · {{k.reqTitle}}</button></td>
      <td style="text-align:right"><button class="btn sm" onClick="{{k.act}}">{{k.actLabel}}</button></td></tr></sc-for></tbody></table></sc-if>
  <sc-if value="{{empty}}"><div class="card-b muted">Khách hàng chưa có hợp đồng nào. Hợp đồng được tải và gắn ở tab Tổng quan của từng yêu cầu.</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"contracts":{"editor":null,"default":[]},"onAct":{"editor":null},"onOpenRequest":{"editor":null},"$preview":{"width":900,"height":260}}'>
class Component extends DCLogic {
  renderVals() {
    const P = this.props, list = P.contracts || [], signedN = list.filter((k) => k.signed).length;
    const rows = list.map((k) => ({ ...k, chip: k.signed ? 'chip ok' : 'chip warn', label: k.signed ? 'Đã ký' : 'Chưa ký', date: k.signed ? k.date : '—', actLabel: k.signed ? 'Gỡ đã ký' : 'Ghi nhận đã ký',
      act: () => P.onAct && P.onAct(k.req, k.signed ? 'unsign' : 'sign'), open: () => P.onOpenRequest && P.onOpenRequest(k.req) }));
    return { rows, hasRows: rows.length > 0, empty: rows.length === 0, sub: signedN + '/' + rows.length + ' đã ký' };
  }
}
</script>
</body>
</html>

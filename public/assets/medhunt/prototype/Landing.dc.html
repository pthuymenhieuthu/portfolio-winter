<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chọn luồng</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./english-dictionary.js"></script>
<script src="./english-ui.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}.lg-logo{display:flex;flex-direction:column;align-items:flex-start;gap:4px}.lg-logo img{display:block;height:44px;width:auto;max-width:none;object-fit:contain}.lg-sub{font-size:12px;font-weight:600;color:var(--brand-ink)}</style></helmet>
<div class="lp-page">
  <span class="lg-logo"><img src="./assets/f594e7ba28d71e65ca5c376c3a9b20ee.png" alt="MedHunt" height="44"><span class="lg-sub">{{t.sub}}</span></span>
  <div style="text-align:center;margin-top:40px"><h1 style="margin:0;font-size:34px;font-weight:800;letter-spacing:-.02em">{{t.title}}</h1><p class="au-sub">{{t.lead}}</p></div>
  <div class="lp-cards">
    <button class="lp-card" onClick="{{pickOnboard}}"><span class="au-icon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.rocket}}"></path></svg></span>
      <h2>{{t.onTitle}}</h2><p>{{t.onDesc}}</p><span class="lp-go">{{t.go}} <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"></path></svg></span></button>
    <button class="lp-card" onClick="{{pickDemo}}"><span class="au-icon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.dash}}"></path></svg></span>
      <h2>{{t.dmTitle}}</h2><p>{{t.dmDesc}}</p><span class="lp-go">{{t.go}} <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"></path></svg></span></button>
  </div>
  <button class="au-pill" style="margin-top:32px" title="{{t.langSwitch}}" onClick="{{onLang}}">{{t.langCur}}</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":null,"default":"vi"},"onLang":{"editor":null},"onPick":{"editor":null},"$preview":{"width":1200,"height":800}}'>
class Component extends DCLogic {
  static T = {
    vi: { sub: 'SMS · Headhunter Y tế', title: 'Chọn cách bắt đầu', lead: 'Hai luồng cùng một ứng dụng, khác nhau ở dữ liệu ban đầu.', go: 'Tiếp tục',
      onTitle: 'Luồng onboarding', onDesc: 'Bắt đầu khi chưa có gì (chỉ có kho hồ sơ ứng viên). Đi từng bước từ khách hàng tới hoàn thành yêu cầu, có hướng dẫn và bỏ qua được.',
      dmTitle: 'Luồng có sẵn', dmDesc: 'Vào thẳng dữ liệu mẫu đầy đủ: khách hàng, yêu cầu, ca tuyển, phí. Dùng để xem và thử từng màn.', langCur: 'Tiếng Việt', langSwitch: 'Chuyển sang tiếng Anh' },
    en: { sub: 'SMS · Healthcare headhunting', title: 'Choose how to start', lead: 'Two flows in the same app, different only in the starting data.', go: 'Continue',
      onTitle: 'Onboarding flow', onDesc: 'Start with nothing but the candidate pool. Walk step by step from a customer to a completed request, with guidance you can skip.',
      dmTitle: 'Existing flow', dmDesc: 'Go straight into the full sample data: customers, requests, cases, fees. Use it to explore each screen.', langCur: 'English', langSwitch: 'Switch to Vietnamese' },
  };
  // Biểu tượng một nét (path d) để dùng được trong hole
  static IC = { rocket: 'M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09zM12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2zM9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5',
    dash: 'M4 3h5a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM15 3h5a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM15 12h5a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1zM4 16h5a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1z' };
  renderVals() {
    const P = this.props, C = Component, pick = (flow) => () => P.onPick && P.onPick(flow);
    return { t: C.T[P.lang] || C.T.vi, ic: C.IC, pickOnboard: pick('onboard'), pickDemo: pick('demo'), onLang: P.onLang };
  }
}
</script>
</body>
</html>

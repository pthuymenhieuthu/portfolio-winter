<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kho ứng viên</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./english-dictionary.js"></script>
<script src="./english-ui.js"></script>
<script src="./filter-multi.js"></script><script src="./line-icons.js"></script><script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet><style>
body{margin:0}
.tb{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row.tb{background:none;border:0;box-shadow:none;border-radius:0;padding:0}
.cd-wrap{overflow-x:auto}.cd-wrap table{min-width:1080px}
.cd-req{display:flex;flex-wrap:wrap;gap:4px;max-width:260px}.cd-req .chip{font-size:11px}
</style></helmet>
<div class="col page-in">
  <div class="dh-stats soft stagger" style="grid-template-columns:repeat(5,minmax(0,1fr))"><sc-for list="{{tiles}}" as="t"><button class="dh-stat" style="{{t.accStyle}}" aria-pressed="{{t.on}}" onClick="{{t.pick}}"><span class="dh-si" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="{{t.iconPath}}"></path></svg></span><span class="dh-num tabular">{{t.n}}</span><span class="dh-label">{{t.label}}</span><span class="dh-info" tabindex="0" role="img" aria-label="{{t.tip}}" data-tip="{{t.tip}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></span></button></sc-for></div>
  <div class="row tb">
    <dc-import name="FilterBar" fields="{{filterFields}}" q="{{q}}" placeholder="Tìm tên, chuyên khoa…" on-q="{{onQ}}" on-apply="{{applyFilters}}" hint-size="100%,56px"></dc-import>
  </div>
  <div class="card"><div class="cd-wrap">
    <table><thead><tr><th>Ứng viên</th><th>Chuyên khoa</th><th>Đối tượng</th><th>Kinh nghiệm</th><th>Yêu cầu &amp; trạng thái</th><th>Nơi đang làm</th><th>Lương</th><th>CCHN</th><th>Ngày nhập</th></tr></thead><tbody class="stagger">
      <sc-for list="{{rows}}" as="c" hint-placeholder-count="5"><tr onClick="{{c.open}}"><td class="fw5">{{c.name}}</td><td>{{c.spec}}</td><td>{{c.target}}</td><td class="tabular">{{c.exp}} năm</td>
        <td><div class="cd-req"><sc-for list="{{c.chips}}" as="e"><span class="chip" style="{{e.style}}">{{e.text}}</span></sc-for><sc-if value="{{c.noReq}}"><span class="muted small">Chưa gắn yêu cầu</span></sc-if></div></td>
        <td>{{c.place}}</td><td class="tabular">{{c.salary}}</td><td><span class="{{c.cchnChip}}">{{c.cchn}}</span></td><td class="tabular">{{c.created}}</td></tr></sc-for></tbody></table></div>
    <sc-if value="{{empty}}"><div class="card-b muted">Không tìm thấy hồ sơ phù hợp. Bỏ bớt bộ lọc hoặc tải CV mới vào kho.</div></sc-if>
    <div class="tfoot"><span>{{footer}}</span><span class="spacer"></span><sc-for list="{{pager}}" as="pg"><button class="{{pg.cls}}" disabled="{{pg.off}}" aria-label="{{pg.aria}}" aria-current="{{pg.cur}}" onClick="{{pg.go}}">{{pg.label}}</button></sc-for></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"cands":{"editor":null,"default":[]},"onOpen":{"editor":null},"q0":{"editor":null},"$preview":{"width":1100,"height":560}}'>
class Component extends DCLogic {
  state = { page: 0, q: null, tile: null, st: [], rq: [], spec: [], cchn: [], note: [] };
  renderVals() {
    const MF = window.MedFilter, S = { ...this.state, q: this.state.q === null ? (this.props.q0 || '') : this.state.q }, all = (this.props.cands || []).map((c) => ({ ...c, entries: c.entries || [] }));
    // Nhóm theo hồ sơ trong yêu cầu: chưa gửi khách (entry không có stage) hoặc stage dưới 7 là đang trong tiến trình; stage 7 là đã hoàn thành; 8 là dừng giữa chừng
    const prog = (c) => c.entries.some((e) => e.stage === null || e.stage < 7), done = (c) => c.entries.some((e) => e.stage === 7), none = (c) => c.entries.length === 0, ended = (c) => c.entries.some((e) => e.stage === 8);
    const T = [['all', 'Tổng hồ sơ', 'Doc', 'var(--brand)', () => true], ['prog', 'Đang trong tiến trình', 'Act', 'var(--tone-yellow)', prog], ['done', 'Đã hoàn thành yêu cầu', 'Check', 'var(--tone-green)', done], ['none', 'Chưa gắn yêu cầu nào', 'Clock', 'var(--tone-violet)', none], ['end', 'Dừng giữa chừng', 'Cross', 'var(--tone-pink)', ended]];
    const TIPS = { all: 'Mọi hồ sơ ứng viên trong kho, kể cả hồ sơ chưa gắn yêu cầu nào.', prog: 'Hồ sơ có ít nhất một yêu cầu còn đang chạy: chưa gửi khách hoặc chưa tới bước hoàn thành.', done: 'Hồ sơ có ít nhất một yêu cầu đã hoàn thành.', none: 'Hồ sơ chưa được gắn vào yêu cầu tuyển dụng nào.', end: 'Hồ sơ có ít nhất một yêu cầu bị dừng giữa chừng.' };
    const tiles = T.map(([k, label, icon, , fn], i) => ({ label, tip: TIPS[k], n: all.filter(fn).length, on: S.tile === k, accStyle: '--acc:var(' + window.MedDash.statTone(i, T.length) + ')', cls: 'ovi', pick: () => this.setState({ tile: S.tile === k ? null : k, page: 0 }), iconPath: window.MedIcons[icon] }));
    const tileFn = (T.find((t) => t[0] === S.tile) || [0, 0, 0, 0, () => true])[4], q = S.q.toLowerCase();
    const NOTES = { cb: (c) => c.callback, exp: (c) => c.cchn === 'Sắp hết hạn', dup: (c) => c.dup };
    const pass = (c) => tileFn(c) && MF.any(S.st, c.entries.map((e) => e.label)) && MF.any(S.rq, c.entries.map((e) => e.req)) && MF.has(S.spec, c.spec) && MF.has(S.cchn, c.cchn) && (!S.note.length || S.note.some((k) => NOTES[k](c))) && (c.name + ' ' + c.spec).toLowerCase().includes(q);
    const list = all.filter(pass).map((c) => ({ ...c, cchnChip: c.cchn === 'Còn hạn' ? 'chip ok' : 'chip warn', noReq: c.entries.length === 0, open: () => this.props.onOpen && this.props.onOpen(c.id),
      chips: [...c.entries.slice(0, 2).map((e) => ({ text: e.req + ' · ' + e.label, style: e.style })), ...(c.entries.length > 2 ? [{ text: '+' + (c.entries.length - 2), style: 'background:var(--surface-2);color:var(--ink-2)' }] : [])] }));
    // Cắt trang SAU khi lọc
    const pg = window.MedPage.view(list, S.page, 'hồ sơ'), rows = pg.rows;
    const uniq = (f) => [...new Set(all.flatMap(f).filter(Boolean))].sort((a, b) => String(a).localeCompare(String(b), 'vi'));
    const filterFields = [MF.field('st', 'Trạng thái trong yêu cầu', uniq((c) => c.entries.map((e) => e.label)).map((v) => [v, v]), S.st, { extra: { page: 0 } }), MF.field('rq', 'Yêu cầu', uniq((c) => c.entries.map((e) => e.req)).map((v) => [v, v]), S.rq, { extra: { page: 0 } }), MF.field('spec', 'Chuyên khoa', uniq((c) => [c.spec]).map((v) => [v, v]), S.spec, { extra: { page: 0 } }),
      MF.field('cchn', 'CCHN', uniq((c) => [c.cchn]).map((v) => [v, v]), S.cchn, { extra: { page: 0 } }), MF.field('note', 'Lưu ý', [['cb', 'Cần liên hệ lại'], ['exp', 'CCHN sắp hết hạn'], ['dup', 'Nghi trùng']], S.note, { extra: { page: 0 } })];
    return { tiles, filterFields, applyFilters: (patch) => this.setState(patch), rows, q: S.q, onQ: (e) => this.setState({ q: e.target.value, page: 0 }), empty: list.length === 0, footer: pg.footer, pager: window.MedPage.pager(this, pg), };
  }
}
</script>
</body>
</html>

      // Mỗi trạng thái lỗi của code có một "tên đăng nhập" gọi ra; mật khẩu sai là câu chung (ERR-IAM-18)
      const kind = u === 'cong' ? 'portal' : u === 'doimk' ? 'kc' : u === 'cauhinh' ? 'config' : u === 'cham' ? 'timeout' : u === 'mang' ? 'network' : null;

      setTimeout(() => {
        if (kind) { patch({ pending: false, fail: kind }); return; }

    return { t, ic: C.IC, doneText: S.done ? t.doneNote : '', isVi: L !== 'en', isEn: L === 'en', curLang: L, used: S.used, showLogin: S.view === 'login', showForgot: S.view === 'forgot', showReset: S.view === 'reset',

      samples: [sample(t.sOk, ok.users[0], ok.pass), sample(t.sReq, 'thieu', ''), sample(t.sBad, 'saimk', ok.pass), sample(t.sInactive, 'ngung', ok.pass), sample(t.sPortal, 'cong', ok.pass), sample(t.sKc, 'doimk', ok.pass), sample(t.sCfg, 'cauhinh', ok.pass), sample(t.sTime, 'cham', ok.pass), sample(t.sNet, 'mang', ok.pass)],
      onU: (e) => patch({ u: e.target.value, fail: null }), onP: (e) => patch({ p: e.target.value, fail: null }), toggleEye: () => patch({ show: !S.show }), toggleRemember: () => patch({ remember: !S.remember }),
      clearFail: () => patch({ fail: null }), onKey: (e) => { if (e && e.key === 'Enter') submit(e); }, openPortal: () => P.onOpenPortal && P.onOpenPortal(), submit, onForgot: P.onForgot || (() => this.setState({ view: 'forgot' })), onBack: P.onBack, onLang: P.onLang || (() => this.setState({ lang: L === 'en' ? 'vi' : 'en' })) };
  }

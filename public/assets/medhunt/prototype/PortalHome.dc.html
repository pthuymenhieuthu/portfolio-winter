<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Cổng KH: Tổng quan</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}.row2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
</style></helmet>
<div class="col page-in g16">
  <div class="page-head tight"><h1>Xin chào {{d.user}}</h1><span class="spacer"></span><button class="btn primary" onClick="{{api.goNew}}">Gửi yêu cầu tuyển dụng</button></div>
  <div class="ovc stagger" style="grid-template-columns:repeat(4,minmax(0,1fr))"><sc-for list="{{tiles}}" as="t" hint-placeholder-count="4"><button class="{{t.cls}}" style="{{t.accStyle}}" aria-pressed="{{t.on}}" onClick="{{t.pick}}"><span class="ovico"><sc-if value="{{t.fClock}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z"></path></svg></sc-if><sc-if value="{{t.fDoc}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Zm0 0v6h6M8 13h8m-8 4h6"></path></svg></sc-if><sc-if value="{{t.fAct}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg></sc-if><sc-if value="{{t.fCheck}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14M22 4 12 14.01l-3-3"></path></svg></sc-if></span><span class="ovn tabular {{t.nCls}}">{{t.n}}</span><span class="ovt">{{t.label}}</span></button></sc-for></div>
  <div class="row2">
    <div class="card"><div class="card-h"><h3>Việc cần làm ngay</h3></div>
      <sc-for list="{{todo}}" as="t"><div class="row" style="padding:12px 24px;border-bottom:1px solid var(--line-soft)"><div class="f1"><div class="fw5">{{t.title}}</div><div class="muted small">{{t.sub}}</div></div><span class="{{t.chip}}">{{t.tag}}</span><button class="btn sm primary" onClick="{{api.goSubs}}">Phản hồi</button></div></sc-for>
      <sc-if value="{{noTodo}}"><div class="card-b muted">Không có việc cần làm. Khi SMS gửi hồ sơ mới, hồ sơ sẽ hiện ở đây.</div></sc-if></div>
    <div class="card"><div class="card-h"><h3>Lịch phỏng vấn</h3><span class="spacer"></span><button class="btn sm" onClick="{{api.goIvs}}">Xem tất cả</button></div>
      <sc-for list="{{ivs}}" as="v"><div class="row" style="padding:12px 24px;border-bottom:1px solid var(--line-soft)"><span class="chip info tabular">{{v.at}}</span><span class="fw5">{{v.name}}</span><span class="muted small">Vòng {{v.round}}</span></div></sc-for>
      <sc-if value="{{noIvs}}"><div class="card-b muted">Chưa có lịch. SMS xếp lịch sau khi có lời mời phỏng vấn.</div></sc-if></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"d":{"editor":null,"default":{"user":"—","requests":[],"cases":[],"ivs":[]}},"api":{"editor":null,"default":{}},"$preview":{"width":1100,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    const d = this.props.d || { user: '—', requests: [], cases: [], ivs: [] }, api = this.props.api || {};
    const fresh = d.cases.filter((c) => c.stage === 0 && !c.decision);
    const open = d.requests.filter((r) => !['CLOSED', 'CANCELLED', 'REJECTED', 'DRAFT'].includes(r.status)).length;
    const ivs = d.ivs.filter((v) => v.status === 'SCHEDULED' || v.status === 'RESCHEDULED').slice(0, 4);
    const tiles = [['Hồ sơ chờ phản hồi', fresh.length, api.goSubs], ['Yêu cầu đang mở', open], ['Phỏng vấn sắp tới', ivs.length], ['Thử việc', d.cases.filter((c) => c.stage === 5).length]].map(([label, n, pick]) => ({ label, n, pick }));
    const DECO = [['Clock'], ['Doc'], ['Act'], ['Check']];
    tiles.forEach((t, i) => Object.assign(t, { cls: 'ovi' + (t.pick ? '' : ' st'), accStyle: '--acc:var(' + window.MedDash.statTone(i, tiles.length) + ')', ['f' + DECO[i][0]]: true }));
    return { tiles, d, api,
      todo: fresh.map((c) => ({ title: 'Hồ sơ ' + c.code, sub: c.reqTitle + ' · ' + c.spec + ', ' + c.exp + ' năm KN', tag: c.viewed ? 'Chờ phản hồi' : 'Mới gửi', chip: c.viewed ? 'chip warn' : 'chip ok' })), noTodo: fresh.length === 0,
      ivs: ivs.map((v) => ({ at: v.at, name: 'Hồ sơ ' + v.code, round: v.round })), noIvs: ivs.length === 0 };
  }
}
</script>
</body>
</html>

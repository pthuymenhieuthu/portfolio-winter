<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Khung màn M3</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./english-dictionary.js"></script>
<script src="./english-ui.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="col page-in">
  <div class="chip info alert">Khung M3: dữ liệu mẫu để duyệt bố cục, chưa có thao tác nghiệp vụ.</div>
  <sc-if value="{{hasTiles}}"><div class="ovc stagger" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))"><sc-for list="{{tiles}}" as="t" hint-placeholder-count="4"><div class="{{t.cls}}" style="{{t.accStyle}}" aria-pressed="{{t.on}}" onClick="{{t.pick}}"><span class="ovico"><sc-if value="{{t.fDoc}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Zm0 0v6h6M8 13h8m-8 4h6"></path></svg></sc-if><sc-if value="{{t.fClock}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z"></path></svg></sc-if><sc-if value="{{t.fAct}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg></sc-if><sc-if value="{{t.fCheck}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14M22 4 12 14.01l-3-3"></path></svg></sc-if></span><span class="ovn tabular {{t.nCls}}">{{t.n}}</span><span class="ovt">{{t.label}}</span></div></sc-for></div></sc-if>
  <sc-if value="{{hasRows}}"><div class="row"><input class="input" style="max-width:300px" placeholder="Tìm trong bảng…" value="{{q}}" onInput="{{onQ}}" aria-label="Tìm trong bảng"><span class="spacer"></span><sc-if value="{{f.action}}"><button class="btn primary">{{f.action}}</button></sc-if></div>
    <div class="card"><table><thead><tr><sc-for list="{{cols}}" as="c"><th>{{c}}</th></sc-for></tr></thead><tbody class="stagger">
      <sc-for list="{{rows}}" as="r"><tr class="nc"><sc-for list="{{r.cells}}" as="c"><td><span class="{{c.cls}}">{{c.t}}</span></td></sc-for></tr></sc-for></tbody></table>
      <sc-if value="{{noMatch}}"><div class="card-b muted">Không có dòng phù hợp.</div></sc-if><div class="tfoot">{{footer}}</div></div></sc-if>
  <sc-if value="{{empty}}"><div class="card"><div class="card-b col"><div class="fw5">{{f.emptyTitle}}</div><div class="muted">{{f.emptySub}}</div></div></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"f":{"editor":null,"default":{"sub":"","tiles":[],"cols":[],"rows":[]}},"$preview":{"width":1100,"height":480}}'>
class Component extends DCLogic {
  state = { q: '' };
  renderVals() {
    const f = this.props.f || { sub: '', tiles: [], cols: [], rows: [] }, q = this.state.q.toLowerCase();
    const norm = (c) => (typeof c === 'object' && c !== null ? c : { t: String(c), cls: '' });
    const all = (f.rows || []).map((r) => ({ cells: r.map(norm) }));
    const rows = all.filter((r) => r.cells.map((c) => c.t).join(' ').toLowerCase().includes(q));
    const DECO = [['Doc'], ['Clock'], ['Act'], ['Check']];
    const tiles = (f.tiles || []).map((t, i) => ({ label: t.label, n: t.n, cls: 'ovi st', accStyle: '--acc:var(' + window.MedDash.statTone(i, (f.tiles || []).length) + ')', ['f' + DECO[i % 4][0]]: true }));
    return { f, tiles, hasTiles: tiles.length > 0, cols: f.cols || [], rows, hasRows: (f.cols || []).length > 0, q: this.state.q, onQ: (e) => this.setState({ q: e.target.value }),
      noMatch: all.length > 0 && rows.length === 0, footer: rows.length + ' / ' + all.length + ' dòng', empty: (f.cols || []).length === 0 };
  }
}
</script>
</body>
</html>

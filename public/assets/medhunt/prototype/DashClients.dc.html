<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Khách hàng hàng đầu</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./english-dictionary.js"></script>
<script src="./english-ui.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}.dcl-wrap{overflow-x:auto}.dcl-wrap table{min-width:640px}</style></helmet>
<div class="dh-card"><div class="dcl-wrap"><table class="dh-table"><thead><tr><th>Khách hàng</th><th class="num">YC mở</th><th class="num">Ca tuyển</th><th class="num">Phí phát sinh</th><th class="num">Đã thu</th></tr></thead><tbody>
  <sc-for list="{{rows}}" as="c"><tr data-click="1" onClick="{{c.go}}"><td class="pri">{{c.name}}</td><td class="num">{{c.open}}</td><td class="num">{{c.cases}}</td><td class="num">{{c.fee}}</td><td class="num">{{c.paid}}</td></tr></sc-for></tbody></table></div>
  <sc-if value="{{empty}}"><div class="dh-empty">Chưa có khách hàng nào có yêu cầu hoặc ca tuyển.</div></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"rows":{"editor":null,"default":[]},"$preview":{"width":1100,"height":320}}'>
class Component extends DCLogic {
  renderVals() { const rows = this.props.rows || []; return { rows, empty: rows.length === 0 }; }
}
</script>
</body>
</html>

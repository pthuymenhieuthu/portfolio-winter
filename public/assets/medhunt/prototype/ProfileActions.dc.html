<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Thao tác hồ sơ</title><script src="./vendor/react.js"></script><script src="./vendor/react-dom.js"></script><script src="./modal-ux.js"></script><script src="./support.js"></script><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="ui.css"></head><body><x-dc>
<helmet><style>.profile-actions textarea{min-height:96px;height:auto;padding:12px;resize:vertical}</style></helmet>
<div class="scrim"><div class="modal anim-scale profile-actions" role="dialog" aria-modal="true" aria-label="{{title}}"><h2>{{title}}</h2><p class="muted">{{intro}}</p>
<sc-if value="{{isRemove}}"><label class="field"><span>Lý do bỏ {{required}}</span><textarea class="input" aria-label="Lý do bỏ" maxlength="255" value="{{reason}}" onInput="{{setReason}}"></textarea></label></sc-if>
<sc-if value="{{isPrescreen}}"><label class="field"><span>Ngày sơ vấn</span><input class="input" aria-label="Ngày sơ vấn" placeholder="dd/mm/yyyy" value="{{date}}" onInput="{{setDate}}"></label><label class="field"><span>Hình thức</span><select class="input" aria-label="Hình thức sơ vấn" onChange="{{setMode}}"><option>Gọi điện</option><option>Gặp trực tiếp</option><option>Trực tuyến</option></select></label><label class="field"><span>Ghi chú sơ vấn</span><textarea class="input" aria-label="Ghi chú sơ vấn" value="{{note}}" onInput="{{setNote}}"></textarea></label></sc-if>
<sc-if value="{{error}}"><p class="t-danger" role="alert">{{error}}</p></sc-if><div class="row"><span class="spacer"></span><button class="btn" onClick="{{close}}">Huỷ</button><button class="btn primary" onClick="{{save}}">Lưu</button></div>
</div></div>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":null},"hasRounds":{"editor":null},"today":{"editor":null},"onSave":{"editor":null},"onClose":{"editor":null}}'>
class Component extends DCLogic {
  componentDidMount() { this.releaseFocus = window.MedModalFocus(() => this.props.onClose?.()); }
  componentWillUnmount() { this.releaseFocus?.(); }
state = { reason: '', date: null, mode: 'Gọi điện', note: '', error: '' };
renderVals() { const S = this.state, P = this.props, rm = P.mode === 'remove'; const set = (key) => (e) => this.setState({ [key]: e.target.value, error: '' });
return { title: rm ? 'Bỏ hồ sơ khỏi yêu cầu' : 'Ghi sơ vấn', intro: rm ? 'Giữ hồ sơ trong kho và giữ lịch sử đánh giá. Lượt đang chờ sẽ được rút.' : 'Ghi dữ kiện trao đổi, không kết luận Đạt hoặc Không đạt.',
isRemove: rm, isPrescreen: !rm, required: P.hasRounds ? '(bắt buộc)' : '(tuỳ chọn)', reason: S.reason, date: S.date ?? P.today, note: S.note, error: S.error,
setReason: set('reason'), setDate: set('date'), setMode: set('mode'), setNote: set('note'), close: P.onClose,
save: () => { const out = P.onSave({ reason: S.reason, date: S.date ?? P.today, mode: S.mode, note: S.note }); if (!out.ok) this.setState({ error: out.message }); } }; }
}
</script></body></html>
